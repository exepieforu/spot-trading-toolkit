name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r signal-predictor/requirements.txt -r trading-bot/requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test signal predictor
        run: python -m pytest signal-predictor -q
      - name: Test trading bot
        run: python -m pytest trading-bot -q
